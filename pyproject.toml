[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ht1b"
version = "0.1.0"
description = "Reduced CL-1B circuit simulation and PhysicsNeMo inverse modeling"
requires-python = ">=3.11,<3.15"
dependencies = ["numpy>=1.26", "scipy>=1.12", "soundfile>=0.12"]

[project.optional-dependencies]
train = ["nvidia-physicsnemo[sym]==2.2.2"]
test = ["pytest>=8"]

[project.scripts]
ht1b = "ht1b.cli:main"

[tool.setuptools]
packages = ["ht1b", "s6"]

[tool.setuptools.package-dir]
ht1b = "src/ht1b"
s6 = "s6"

[tool.setuptools.package-data]
s6 = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "s6/tests"]
pythonpath = ["src", "."]
